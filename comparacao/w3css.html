<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card — W3.CSS 5</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <style>
.w3-button{background-color:#176B5B;color:#fff;border-radius:8px}
.w3-button:hover{background-color:#14532D!important;color:#fff!important}
.w3-card{border:1px solid #CBD5D1}
  </style>
</head>
<body>
  <main class="w3-container">
    <h1>Card em W3.CSS</h1>
    <div class="w3-card">
      <header class="w3-container w3-light-grey"><h2>Visita ao domicílio</h2></header>
      <div class="w3-container">
        <p>Alimentação, água fresca, limpeza da caixa de areia e um período de companhia e brincadeira.</p>
      </div>
      <a href="#" class="w3-button w3-block">Pedir informações</a>
    </div>
  </main>
</body>
</html>
