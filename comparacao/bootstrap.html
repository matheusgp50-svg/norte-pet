<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card — Bootstrap 5.3.9</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <style>
.btn-primary{--bs-btn-bg:#176B5B;--bs-btn-border-color:#176B5B;--bs-btn-hover-bg:#14532D;--bs-btn-hover-border-color:#14532D;--bs-btn-border-radius:8px}
.card{--bs-card-border-color:#CBD5D1}
  </style>
</head>
<body>
  <main class="p-3">
    <h1 class="h4">Card em Bootstrap</h1>
    <div class="card">
      <div class="card-body">
        <h2 class="card-title h5">Visita ao domicílio</h2>
        <p class="card-text">Alimentação, água fresca, limpeza da caixa de areia e um período de companhia e brincadeira.</p>
        <a href="#" class="btn btn-primary">Pedir informações</a>
      </div>
    </div>
  </main>
</body>
</html>
